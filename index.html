<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slatinwine · 应用商店</title>
<style>
  :root{
    --bg:#E8E6E1;
    --tile:#F4F3EF;
    --ink:#1C1B19;
    --ink-2:#6E6A63;
    --line:#D6D3CC;
    --shadow:0 1px 2px rgba(28,27,25,.06), 0 8px 24px rgba(28,27,25,.08);
    --shadow-hover:0 2px 4px rgba(28,27,25,.08), 0 16px 40px rgba(28,27,25,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    /* 细腻的水泥纹理 */
    background-image:
      radial-gradient(rgba(28,27,25,.022) 1px, transparent 1px),
      radial-gradient(rgba(28,27,25,.014) 1px, transparent 1px);
    background-size:7px 7px, 11px 11px;
    background-position:0 0, 3px 5px;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:56px 28px 80px}

  header{margin-bottom:36px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .kicker{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink-2);margin-bottom:14px;
    display:flex;align-items:center;gap:14px;
  }
  .kicker::after{content:"";flex:1;height:1px;background:var(--line)}
  h1{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  h1 .thin{font-weight:300;color:var(--ink-2)}
  .sub{margin-top:10px;font-size:14px;color:var(--ink-2);line-height:1.7}
  .sub a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-2)}
  .sub a:hover{opacity:.7}

  /* 账号入口：登录 / 已登录邮箱 */
  .auth-btn{
    background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:8px 18px;font-size:13px;color:var(--ink-2);cursor:pointer;
    font-family:inherit;transition:all .15s;white-space:nowrap;flex:none;
  }
  .auth-btn:hover{border-color:var(--ink-2);color:var(--ink)}
  .auth-btn.in{border-color:var(--ink);color:var(--ink);font-weight:600}

  .toolbar{margin:30px 0 8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{
    flex:1;min-width:220px;max-width:360px;
    background:var(--tile);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;font-size:14px;color:var(--ink);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search::placeholder{color:#A8A49C}
  .search:focus{border-color:var(--ink-2);box-shadow:var(--shadow)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{
    background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:7px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;
    font-family:inherit;transition:all .15s;
  }
  .tab:hover{border-color:var(--ink-2);color:var(--ink)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .count{font-size:12px;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}

  /* 分类标题 */
  .section-title{
    margin:38px 0 16px;font-size:13px;letter-spacing:.24em;
    color:var(--ink-2);text-transform:uppercase;
    display:flex;align-items:center;gap:14px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}

  /* 应用网格 */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
  }
  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--tile);
    border:1px solid var(--line);
    border-radius:22px;
    padding:16px;
    text-decoration:none;color:inherit;
    box-shadow:var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
    position:relative;
    cursor:pointer;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#BEBAB2}
  .card:active{transform:translateY(-1px)}

  /* 圆角矩形图标 */
  .icon{
    width:58px;height:58px;flex:none;
    border-radius:16px;
    background:linear-gradient(145deg,#F6F5F1 0%,#E9E7E1 100%);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:24px;color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(28,27,25,.08);
    position:relative;
    font-family:Georgia,"Songti SC",serif;
  }
  .icon .lang-dot{
    position:absolute;right:5px;bottom:5px;
    width:9px;height:9px;border-radius:50%;
    border:1.5px solid var(--tile);
  }
  .meta{min-width:0;flex:1}
  .name{
    font-size:15px;font-weight:700;line-height:1.3;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .name .en{font-weight:400;color:var(--ink-2);font-size:12px}
  .desc{
    margin-top:4px;font-size:12.5px;color:var(--ink-2);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .badges{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge{
    font-size:10.5px;padding:2px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-2);letter-spacing:.05em;
  }
  .badge.live{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .badge.fork{border-style:dashed}

  footer{
    margin-top:64px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-2);line-height:1.8;
  }
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-2)}
  .empty{padding:60px 0;text-align:center;color:var(--ink-2);font-size:14px;display:none}

  @media (max-width:560px){
    .wrap{padding:36px 16px 60px}
    h1{font-size:26px}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .card{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
    .count{width:100%;margin-left:0}
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="head-row">
      <div style="min-width:0;flex:1">
        <div class="kicker">GITHUB APP STORE</div>
        <h1>slatinwine <span class="thin">· 应用商店</span></h1>
        <p class="sub">
          GitHub 公开仓库的网页版商店 · 点击圆角矩形图标即跳转到对应的在线应用（已开启 Pages 的仓库）或仓库主页 ·
          由 GitHub Action 每日自动重建 · <a href="https://github.com/slatinwine?tab=repositories" target="_blank" rel="noopener">查看全部仓库</a>
        </p>
      </div>
      <!-- 账号入口：弹窗打开注册中心，登录成功后回传用户标识 -->

    </div>
  </header>

    <div class="tabs" id="tabs"></div>
    <div class="count" id="count"></div>
  </div>

  <main id="main"></main>
  <div class="empty" id="empty">没有匹配的应用，换个关键词试试。</div>

  <footer>

    由 GitHub Action 每日自动重建 · <a href="https://github.com/slatinwine/app-store" target="_blank" rel="noopener">github.com/slatinwine/app-store</a>

</div>

const LANG_COLOR = {
  "HTML":"#e34c26", "JavaScript":"#f1e05a", "TypeScript":"#3178c6", "Python":"#3572A5"
};
const REPO = "https://github.com/slatinwine/";

/* ---- 渲染 ---- */
const main = document.getElementById("main");
const tabsEl = document.getElementById("tabs");
const qEl = document.getElementById("q");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");

const CATS = ["全部", ...new Set(APPS.map(a=>a.cat))];
let curCat = "全部", curQ = "";

function monogram(a){
  const t = a.t || a.n;
  return [...t][0].toUpperCase();
}
function targetUrl(a){
  if (a.home) return a.home;
  if (a.pages) return "https://slatinwine.github.io/" + a.n + "/";
  return REPO + a.n;
}

APPS.forEach(a => a._url = targetUrl(a));

function cardHTML(a){
  const dot = a.lang ? `<span class="lang-dot" style="background:${LANG_COLOR[a.lang]||"#8B8680"}"></span>` : "";
  const badges = [];
  if (a.home || a.pages) badges.push(`<span class="badge live">在线</span>`);
  if (a.fork) badges.push(`<span class="badge fork">Fork</span>`);
  if (a.stars) badges.push(`<span class="badge">${a.stars} star</span>`);
  badges.push(`<span class="badge">${a.n}</span>`);
  return `<a class="card" href="${a._url}" target="_blank" rel="noopener">
    <div class="icon">${monogram(a)}${dot}</div>
    <div class="meta">
      <div class="name">${a.t}${a.t===a.n ? "" : ` <span class="en">${a.n}</span>`}</div>
      <div class="desc">${a.d || ""}</div>
      <div class="badges">${badges.join("")}</div>
    </div>
  </a>`;
}

function render(){
  const kw = curQ.trim().toLowerCase();
  const list = APPS.filter(a =>
    (curCat==="全部" || a.cat===curCat) &&
    (!kw || (a.t+" "+a.n+" "+(a.d||"")).toLowerCase().includes(kw))
  );
  // 按分类分组显示
  let html = "";
  const groups = {};
  list.forEach(a => (groups[a.cat] ||= []).push(a));
  for (const [cat, items] of Object.entries(groups)){
    if (curCat==="全部"){
      html += `<div class="section-title">${cat} · ${items.length}</div>
               <div class="grid">${items.map(cardHTML).join("")}</div>`;
    } else {
      html += `<div class="grid">${items.map(cardHTML).join("")}</div>`;
    }
  }
  main.innerHTML = html;
  emptyEl.style.display = list.length ? "none" : "block";
  countEl.textContent = `${list.length} / ${APPS.length} 个应用`;
}

function renderTabs(){
  tabsEl.innerHTML = CATS.map(c =>
    `<button class="tab${c===curCat?" on":""}" data-cat="${c}">${c}</button>`
  ).join("");
}
tabsEl.addEventListener("click", e=>{
  const b = e.target.closest(".tab");
  if(!b) return;
  curCat = b.dataset.cat;
  renderTabs(); render();
});
qEl.addEventListener("input", ()=>{ curQ = qEl.value; render(); });

/* ---- 账号中心登录（WorkBuddy 云端账号体系） ----
 * 点击「登录 / 注册」弹窗打开注册中心；登录成功后注册中心 postMessage
 * 回传 { email, id }（仅展示用标识，会话令牌不出账号中心域名）。
 * 后续做收藏 / 评论等按用户存数据的功能时，对应页面建议挂在
 * 账号中心同一应用下，以直接复用云端会话。 */
const ACCOUNT_URL = "https://account-center-12268.app.workbuddy.host/";
const ACCOUNT_ORIGIN = "https://account-center-12268.app.workbuddy.host";
const AUTH_KEY = "appstore_user_v1";
const authBtn = document.getElementById("authBtn");

function getStoreUser(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY)) } catch (e) { return null }
}
function renderAuth(){
  const u = getStoreUser();
  if (u && u.email){
    authBtn.textContent = [...u.email][0].toUpperCase() + " " + u.email;
    authBtn.classList.add("in");
  } else {
    authBtn.textContent = "登录 / 注册";
    authBtn.classList.remove("in");
  }
}
authBtn.addEventListener("click", () => {
  const u = getStoreUser();
  if (u && u.email){
    if (confirm("退出登录 " + u.email + " ？")){
      localStorage.removeItem(AUTH_KEY);
      renderAuth();
    }
    return;
  }
  window.open(ACCOUNT_URL + "?popup=1", "account-center", "popup,width=430,height=720");
});
window.addEventListener("message", (e) => {
  if (e.origin !== ACCOUNT_ORIGIN) return;
  const d = e.data;
  if (d && d.source === "account-center" && d.type === "login-success" && d.user){
    localStorage.setItem(AUTH_KEY, JSON.stringify(d.user));
    renderAuth();
  }
});
renderAuth();

renderTabs(); render();
</script>
